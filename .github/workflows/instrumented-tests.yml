name: Instrumented tests

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  # Also runs when this file changes, so an edit is tried before the next night.
  push:
    paths:
      - '.github/workflows/instrumented-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Phone (core:network, mobile)
            target: google_apis
            arch: x86_64
            profile: pixel_6
            build: ':core:network:assembleDebugAndroidTest :mobile:assembleDebug :mobile:assembleDebugAndroidTest'
            tasks: ':core:network:connectedDebugAndroidTest :mobile:connectedDebugAndroidTest'
          - name: TV (tv)
            target: android-tv
            arch: x86
            profile: tv_1080p
            build: ':tv:assembleDebug :tv:assembleDebugAndroidTest'
            tasks: ':tv:connectedDebugAndroidTest'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Remove local Java home from gradle.properties
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build the APKs before the emulator boots, so it isn't idle during the build.
      - name: Build test APKs
        run: ./gradlew ${{ matrix.build }}

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew ${{ matrix.tasks }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports-${{ matrix.target }}
          path: '**/build/reports/androidTests/'
          retention-days: 14

name: Release

# A tag v<versionName> (gradle.properties) builds both apps' release APKs, signs them with the
# release key (release plan D7) and publishes them as a GitHub Release. See docs/RUN_GUIDE.md → "Releasing".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Remove local Java home from gradle.properties
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: The tag matches the version
        run: |
          version="$(sed -n 's/^fijerena.versionName=//p' gradle.properties)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but gradle.properties has versionName $version: tag v$version, or raise the version first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.FIJERENA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The FIJERENA_KEYSTORE_BASE64 secret is missing (docs/RUN_GUIDE.md → Releasing)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FIJERENA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APKs
        env:
          FIJERENA_KEYSTORE_PASSWORD: ${{ secrets.FIJERENA_KEYSTORE_PASSWORD }}
          FIJERENA_KEY_ALIAS: ${{ secrets.FIJERENA_KEY_ALIAS }}
          FIJERENA_KEY_PASSWORD: ${{ secrets.FIJERENA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Without the key the build leaves *-release-unsigned.apk; only signed APKs are published.
      - name: Collect the APKs
        run: |
          mkdir dist
          cp tv/build/outputs/apk/release/tv-release.apk "dist/fijerena-tv-$VERSION.apk"
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/fijerena-phone-$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      # The notes are docs/RELEASE_NOTES.md's first section (the one for this release).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1 && !/^## /' docs/RELEASE_NOTES.md > notes.md
          printf '\nInstall `fijerena-tv-%s.apk` on a TV and `fijerena-phone-%s.apk` on a phone.\n' "$VERSION" "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Fijerena $VERSION" --notes-file notes.md

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

name: Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'server/**'
      - 'scripts/focus-walks/**'
      - '.github/workflows/checks.yml'
      - '.github/workflows/server.yml'
      - '.github/workflows/instrumented-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties asks for a JDK 21 daemon, and auto-download is off.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The local Java home goes; the build's heap rises from 2.5 GB to 4 GB, because the release
      # dex merge of the phone app ran out of memory at 2.5 GB (the runner has 16 GB).
      - name: Fit gradle.properties to the runner
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i 's/^org.gradle.jvmargs=-Xmx2560m /org.gradle.jvmargs=-Xmx4g /' gradle.properties
          grep -q '^org.gradle.jvmargs=-Xmx4g ' gradle.properties

      # One Gradle run, so its tasks share the runner's cores: ktlint, the unit tests, Android Lint
      # (existing warnings live in each module's lint-baseline.xml; only new issues fail the build),
      # the debug APKs and the instrumented tests' build (the tests themselves run nightly,
      # instrumented-tests.yml).
      - name: Lint, unit tests, Android Lint and debug APKs
        run: ./gradlew ktlintCheck testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Room schemas are committed and current
        run: |
          if [ -n "$(git status --porcelain -- core/network/schemas)" ]; then
            git status --porcelain -- core/network/schemas
            echo "The build changed a Room schema: bump the database version, add its Migration, and commit core/network/schemas/."
            exit 1
          fi

      - name: Upload mobile APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload TV APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tv-debug-apk
          path: tv/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Each build on main saves a new copy of the Gradle caches (each 0.5 GB or more), but the next
  # build restores only the newest. The old copies filled the repository's 10 GB of Actions cache,
  # and GitHub then deleted the oldest entries, the emulator system images among them. This job
  # keeps the newest entry of each Gradle cache and deletes the others.
  prune-gradle-caches:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete old Gradle cache entries
        run: |
          # The kind of an entry is its key without the content hash or the build's tag at the end,
          # for example gradle-transforms-v1 or gradle-home-v1|Linux-X64|build.
          gh cache list --ref refs/heads/main --limit 1000 --json id,key,createdAt --jq '
            map(select(.key | startswith("gradle-")))
            | map(. + {kind: (.key | sub("\\[.*$"; "") | sub("-[0-9a-f]{32,}$"; ""))})
            | group_by(.kind)[]
            | sort_by(.createdAt) | reverse | .[1:][]
            | "\(.id) \(.key)"' |
          while read -r id key; do
            echo "Delete $key"
            gh cache delete "$id"
          done
